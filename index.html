<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon CV Collection</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #1a1a24;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        h1 { margin-bottom: 8px; font-size: 2rem; }
        p { color: #a0a0b0; margin-bottom: 30px; }
        .grid {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .card {
            background: #252535;
            border-radius: 16px;
            padding: 24px;
            width: 240px;
            text-align: center;
            text-decoration: none;
            color: inherit;
            border: 2px solid transparent;
            transition: all 0.2s ease;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card.pikachu:hover { border-color: #fcd116; box-shadow: 0 8px 20px rgba(252, 209, 22, 0.25); }
        .card.snorlax:hover { border-color: #2d5d6b; box-shadow: 0 8px 20px rgba(45, 93, 107, 0.35); }
        .icon { font-size: 2.5rem; margin-bottom: 10px; }
        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 8px 18px;
            border-radius: 20px;
            background: #ffffff;
            color: #1a1a24;
            font-weight: bold;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <h1>🎮 Pokémon CV Template Collection</h1>
    <p>Selecciona una plantilla para ver el portafolio temático:</p>

    <div class="grid">
        <a href="./pikachu/index.html" class="card pikachu">
            <div class="icon">⚡</div>
            <h3>Pikachu Edition</h3>
            <p style="font-size: 0.85rem;">Tema Eléctrico</p>
            <span class="btn">Ver Template</span>
        </a>

        <a href="./snorlax/index.html" class="card snorlax">
            <div class="icon">💤</div>
            <h3>Snorlax Edition</h3>
            <p style="font-size: 0.85rem;">Tema Normal / Tanque</p>
            <span class="btn">Ver Template</span>
        </a>
    </div>
</body>
</html>
